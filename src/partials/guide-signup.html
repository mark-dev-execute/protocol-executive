<section class="section alt" id="subscribe">
  <div class="wrap split center">
    <div>
      <span class="eyebrow">Free guides by email</span>
      <h2>Get the next guide in your inbox.</h2>
      <p>New practical guides on interviews, workplace communication and leadership for tech professionals — sent when they’re published. No spam, and you can unsubscribe at any time.</p>
    </div>
    <form class="form subscribe-form" action="{{base}}/api/subscribe" method="post" data-subscribe-form>
      <label class="field">Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <div class="hp" aria-hidden="true"><label>Company<input name="company" tabindex="-1" autocomplete="off"></label></div>
      <input type="hidden" name="source" value="unknown">
      <input type="hidden" name="t" value="">
      <label class="consent"><input type="checkbox" name="consent" required><span>Email me new guides and occasional coaching tips from Fluent in Tech. I can unsubscribe at any time. See the <a class="text-link" href="{{base}}/privacy/#email-list">privacy policy</a>.</span></label>
      <button class="btn btn-primary" type="submit" data-track="subscribe-submit">Subscribe</button>
      <p class="form-status" aria-live="polite"></p>
    </form>
  </div>
</section>
